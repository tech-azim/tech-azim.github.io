<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOCUS – One Goal, One Thing</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function FocusApp() {
        /* ---------------- STATE ---------------- */
        const [screen, setScreen] = useState("home");

        const [goal, setGoal] = useState("");
        const [goalInput, setGoalInput] = useState("");

        const [dailyTask, setDailyTask] = useState("");
        const [taskInput, setTaskInput] = useState("");

        const [estimatedTime, setEstimatedTime] = useState(25);
        const [timeLeft, setTimeLeft] = useState(25 * 60);
        const [timerActive, setTimerActive] = useState(false);

        const [reflectionStatus, setReflectionStatus] = useState(null);
        const [reflectionNote, setReflectionNote] = useState("");

        const [showEndWarning, setShowEndWarning] = useState(false);
        const [sessionCompleted, setSessionCompleted] = useState(true);

        const [todayCompleted, setTodayCompleted] = useState(false);
        const [completedTask, setCompletedTask] = useState("");

        /* ---------------- LOAD ---------------- */
        useEffect(() => {
          const today = new Date().toISOString().split("T")[0];

          const savedGoal = localStorage.getItem("focus_goal");
          const savedTask = localStorage.getItem("focus_daily_task");
          const lastSessionDate = localStorage.getItem(
            "focus_last_session_date",
          );

          if (savedGoal) {
            setGoal(savedGoal);
            setGoalInput(savedGoal);
          }

          if (lastSessionDate === today) {
            setTodayCompleted(true);
            setCompletedTask(
              localStorage.getItem("focus_completed_task") || "",
            );
          } else if (savedTask) {
            setDailyTask(savedTask);
            setTaskInput(savedTask);
          }
        }, []);

        /* ---------------- TIMER ---------------- */
        useEffect(() => {
          if (!timerActive || timeLeft <= 0) return;

          const interval = setInterval(() => {
            setTimeLeft((t) => t - 1);
          }, 1000);

          return () => clearInterval(interval);
        }, [timerActive, timeLeft]);

        useEffect(() => {
          if (timeLeft === 0) {
            setTimerActive(false);
            setSessionCompleted(true);
            setScreen("reflection");
          }
        }, [timeLeft]);

        const formatTime = (s) => {
          const m = Math.floor(s / 60);
          const sec = s % 60;
          return `${m.toString().padStart(2, "0")}:${sec.toString().padStart(2, "0")}`;
        };

        /* ---------------- ACTIONS ---------------- */
        const saveGoal = () => {
          if (!goalInput.trim()) return;
          localStorage.setItem("focus_goal", goalInput);
          localStorage.setItem("focus_has_set_goal", "true");
          setGoal(goalInput);
          setScreen("home");
        };

        const startFocus = () => {
          if (timerActive) return;

          const task = taskInput.trim() || dailyTask;
          if (!task) return;

          setDailyTask(task);
          localStorage.setItem("focus_daily_task", task);

          setTimeLeft(estimatedTime * 60);
          setTimerActive(true);
          setSessionCompleted(false);
          setShowEndWarning(false);
          setScreen("focus");
        };

        const endSession = () => {
          if (!showEndWarning && timeLeft > 0) {
            setShowEndWarning(true);
            return;
          }
          setTimerActive(false);
          setScreen("reflection");
        };

        const saveReflection = (status) => {
          const today = new Date().toISOString().split("T")[0];
          const raw = JSON.parse(
            localStorage.getItem("focus_weekly_data") || "[]",
          );

          const filtered = raw.filter((d) => d.date !== today);

          filtered.push({
            date: today,
            task: dailyTask,
            status,
            note: reflectionNote,
            duration: estimatedTime,
            completed: sessionCompleted,
          });

          localStorage.setItem("focus_weekly_data", JSON.stringify(filtered));
          localStorage.setItem("focus_last_session_date", today);
          localStorage.setItem("focus_completed_task", dailyTask);

          setTodayCompleted(true);
          setCompletedTask(dailyTask);
          setReflectionStatus(null);
          setReflectionNote("");
          setScreen("home");
        };

        const getWeeklyStats = () => {
          const raw = JSON.parse(
            localStorage.getItem("focus_weekly_data") || "[]",
          );
          const last = raw.slice(-7);

          const focused = last.filter((d) => d.status === "progress").length;
          const distracted = last.filter((d) => d.status !== "progress").length;

          return { focused, distracted, data: last };
        };

        const getWeeklyTruth = ({ focused, data }) => {
          if (data.length === 0) return "No data yet. Start today.";
          if (focused === 0)
            return "Zero days focused. Your goal is still imaginary.";
          if (focused === 1)
            return "One focused day in seven. You are busy, not committed.";
          if (focused === 2)
            return "Two focused days in seven. You are busy, not committed.";
          if (focused <= 4)
            return "Half the week is something. The other half is the question.";
          if (focused === 5) return "Five days is real. Can you make it six?";
          if (focused === 6) return "Six days is real. Can you make it seven?";
          return "Seven days. This is what commitment looks like.";
        };

        /* ---------------- SCREENS ---------------- */

        if (screen === "goal") {
          return (
            <div className="min-h-screen bg-white flex items-center justify-center p-8">
              <div className="max-w-md w-full space-y-8 text-center">
                <h2 className="text-2xl font-light">What do you want?</h2>
                <textarea
                  value={goalInput}
                  onChange={(e) => setGoalInput(e.target.value)}
                  className="w-full text-center text-xl border-2 border-gray-200 p-4 resize-none"
                />
                <button
                  onClick={saveGoal}
                  className="w-full py-4 bg-black text-white"
                >
                  Set Goal
                </button>
              </div>
            </div>
          );
        }

        if (screen === "focus") {
          return (
            <div className="min-h-screen bg-black text-white flex items-center justify-center p-8">
              <div className="max-w-md w-full text-center space-y-12">
                <p className="text-gray-400 text-sm">{goal}</p>
                <h2 className="text-2xl font-light">{dailyTask}</h2>
                <p className="text-8xl font-extralight tabular-nums">
                  {formatTime(timeLeft)}
                </p>

                <button
                  onClick={() => setTimerActive(!timerActive)}
                  className="px-8 py-3 border border-white"
                >
                  {timerActive ? "Pause" : "Resume"}
                </button>

                {showEndWarning && (
                  <p className="text-sm text-gray-400">
                    Ending early won’t bring you closer to your goal.
                  </p>
                )}

                <button onClick={endSession} className="text-sm text-gray-500">
                  {showEndWarning ? "End Anyway" : "End Session"}
                </button>
              </div>
            </div>
          );
        }

        if (screen === "reflection") {
          return (
            <div className="min-h-screen bg-white flex items-center justify-center p-8">
              <div className="max-w-md w-full space-y-8 text-center">
                <h2 className="text-2xl font-light">
                  {sessionCompleted ? "You finished." : "You stopped early."}
                </h2>

                <div className="flex justify-center space-x-8 text-5xl">
                  <button onClick={() => saveReflection("progress")}>✅</button>
                  <button onClick={() => saveReflection("neutral")}>😐</button>
                  <button onClick={() => saveReflection("failed")}>❌</button>
                </div>
              </div>
            </div>
          );
        }

        if (screen === "weekly") {
          const stats = getWeeklyStats();
          const truth = getWeeklyTruth(stats);

          return (
            <div className="min-h-screen bg-white flex items-center justify-center p-8">
              <div className="max-w-md w-full space-y-10 text-center">
                <h2 className="text-2xl font-light">Weekly Truth</h2>

                <div>
                  <p className="text-6xl font-light">{stats.focused}</p>
                  <p className="text-sm text-gray-500 uppercase tracking-wider">
                    Days Focused
                  </p>
                </div>

                <div>
                  <p className="text-4xl text-gray-400">{stats.distracted}</p>
                  <p className="text-sm text-gray-500 uppercase tracking-wider">
                    Days Distracted
                  </p>
                </div>

                <p className="text-gray-600 font-light">{truth}</p>

                <button
                  onClick={() => setScreen("home")}
                  className="w-full py-3 border-2 border-gray-200"
                >
                  Back
                </button>
              </div>
            </div>
          );
        }

        /* ---------------- HOME ---------------- */
        return (
          <div className="min-h-screen bg-white flex items-center justify-center p-8">
            <div className="max-w-md w-full space-y-12 text-center">
              {goal ? (
                <h1 className="text-3xl font-light">{goal}</h1>
              ) : (
                <button
                  onClick={() => setScreen("goal")}
                  className="text-gray-300 text-3xl"
                >
                  What matters enough to fight for?
                </button>
              )}

              {!todayCompleted ? (
                <div className="space-y-4">
                  <input
                    value={taskInput}
                    onChange={(e) => setTaskInput(e.target.value)}
                    placeholder="What’s the one thing you’ll do today?"
                    className="w-full text-center text-xl border-b-2 border-gray-200 py-3"
                  />

                  <button
                    onClick={startFocus}
                    className="w-full py-4 bg-black text-white"
                  >
                    Begin
                  </button>
                </div>
              ) : (
                <p className="text-gray-500">Today is done.</p>
              )}

              <button
                onClick={() => setScreen("weekly")}
                className="text-sm text-gray-400 uppercase tracking-wider"
              >
                Weekly Truth
              </button>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("app")).render(<FocusApp />);
    </script>
  </body>
</html>
